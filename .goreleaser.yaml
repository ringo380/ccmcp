# Config reference: https://goreleaser.com/customization/
version: 2

project_name: ccmcp

before:
  hooks:
    - go mod tidy

builds:
  - id: ccmcp
    main: .
    binary: ccmcp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    # Bare-binary archives: tar.gz for unix, zip for windows (what Scoop and
    # winget expect). README + LICENSE + CHANGELOG ride along.
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: '{{ .Tag }}-next'

changelog:
  # Derive release notes from git log since the previous tag, grouped by conventional-
  # commit prefix. Skips chores/docs/ci so the published notes focus on user-visible work.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Refactors
      regexp: '^.*?refactor(\(.+\))??!?:.+$'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^chore'
      - '^docs'
      - '^ci'
      - '^test'
      - 'Merge pull request'
      - 'Merge branch'

release:
  draft: false
  prerelease: auto
  # Prepend an install blurb so release pages have a working copy-paste line.
  header: |
    ## Install

    ```sh
    brew install robworks-code/tap/ccmcp
    ```

    Or via Go toolchain:

    ```sh
    go install github.com/ringo380/ccmcp@{{ .Tag }}
    ```

    On Windows, via Scoop:

    ```powershell
    scoop bucket add robworks https://github.com/robworks-code/scoop-bucket
    scoop install ccmcp
    ```

    or winget (once the manifest is accepted upstream):

    ```powershell
    winget install Robworks.ccmcp
    ```

    Or grab a prebuilt binary for your platform from the Assets below and drop it in `~/bin`.

# Homebrew formula is auto-regenerated on each non-prerelease tag and pushed to
# robworks-code/homebrew-tap. Requires a HOMEBREW_TAP_TOKEN secret (PAT with
# contents:write on the tap repo) exposed to the release workflow. See
# .github/workflows/release.yml.
brews:
  - name: ccmcp
    repository:
      owner: robworks-code
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(formula): bump {{ .ProjectName }} to {{ .Tag }}"
    homepage: "https://github.com/ringo380/ccmcp"
    description: "Dynamic CLI + TUI for managing Claude Code MCP servers, plugins, and per-project overrides"
    license: "MIT"
    # Only publish the formula on actual (non-prerelease) tags.
    skip_upload: auto
    install: |
      bin.install "ccmcp"
    test: |
      assert_match "ccmcp version", shell_output("#{bin}/ccmcp --version")

# Scoop manifest lands in the bucket ROOT (a subdirectory breaks `scoop bucket
# list`). Reuses HOMEBREW_TAP_TOKEN: a classic PAT with repo scope, which covers
# robworks-code/scoop-bucket too. See release.yml.
scoops:
  - name: ccmcp
    repository:
      owner: robworks-code
      name: scoop-bucket
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(scoop): bump {{ .ProjectName }} to {{ .Tag }}"
    homepage: "https://github.com/ringo380/ccmcp"
    description: "Dynamic CLI + TUI for managing Claude Code MCP servers, plugins, and per-project overrides"
    license: "MIT"
    skip_upload: auto

# winget manifests go to the ringo380/winget-pkgs fork on a per-version branch
# and a PR is opened against microsoft/winget-pkgs. First submission is
# human-reviewed by Microsoft. Package identifier must match
# internal/selfupdate wingetID.
winget:
  - name: ccmcp
    publisher: Robworks
    package_identifier: Robworks.ccmcp
    short_description: "Dynamic CLI + TUI for managing Claude Code MCP servers, plugins, and per-project overrides"
    license: "MIT"
    homepage: "https://github.com/ringo380/ccmcp"
    publisher_url: "https://code.robworks.info"
    publisher_support_url: "https://github.com/ringo380/ccmcp/issues"
    license_url: "https://github.com/ringo380/ccmcp/blob/main/LICENSE"
    release_notes_url: "https://github.com/ringo380/ccmcp/releases/tag/{{ .Tag }}"
    tags: [claude, mcp, cli, tui]
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "{{ .PackageIdentifier }}: {{ .Tag }}"
    repository:
      owner: ringo380
      name: winget-pkgs
      branch: "ccmcp-{{ .Version }}"
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    skip_upload: auto
